spring.application.name=api-gateway

server.port=8080

spring.cloud.gateway.mvc.routes[0].id=doctor-service
spring.cloud.gateway.mvc.routes[0].uri=http://doctor-service:8081
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/doctors/**

spring.cloud.gateway.mvc.routes[1].id=patient-service
spring.cloud.gateway.mvc.routes[1].uri=http://patient-service:8082
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/patients/**

spring.cloud.gateway.mvc.routes[2].id=appointment-service
spring.cloud.gateway.mvc.routes[2].uri=http://appointment-service:8083
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/appointments/**

spring.cloud.gateway.mvc.routes[3].id=queue-service
spring.cloud.gateway.mvc.routes[3].uri=http://queue-service:8084
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/queue/**

spring.cloud.gateway.mvc.routes[4].id=report-service
spring.cloud.gateway.mvc.routes[4].uri=http://report-service:8085
spring.cloud.gateway.mvc.routes[4].predicates[0]=Path=/reports/**